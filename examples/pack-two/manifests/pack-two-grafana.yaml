# Grafana for Pack 2 - DEV Team Monitoring Visualization
# This is a dedicated Grafana instance for Pack 2 that queries Pack 2's VMSingle
# It can discover and display dashboards labeled for Pack 2

apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  labels:
    name: pack-two-grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: monitoring-operator
    pack: two
  name: pack-two-grafana
  namespace: monitoring
spec:
  # Grafana configuration
  config:
    auth:
      disable_login_form: false
      disable_signout_menu: true
    auth.anonymous:
      enabled: false
    log:
      level: info
      mode: console
    server:
      root_url: "http://grafana-pack-two.local"

  # Security credentials
  deployment:
    spec:
      template:
        spec:
          securityContext:
            fsGroup: 2000
            runAsUser: 2000

  # Resource allocation
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Service configuration
  service:
    metadata:
      labels:
        pack: two
    spec:
      type: ClusterIP
      ports:
        - name: http
          port: 3000
          protocol: TCP
          targetPort: http

  # Dashboard discovery configuration
  # This selector will find GrafanaDashboard resources with pack=two label
  dashboardLabelSelector:
    - matchExpressions:
        - key: pack
          operator: In
          values: ["two"]
        - key: app.kubernetes.io/component
          operator: In
          values: ["monitoring"]

  # Namespace selector for dashboard discovery
  dashboardNamespaceSelector:
    matchExpressions:
      - key: openshift.io/cluster-monitoring
        operator: NotIn
        values: ["true"]

  # Optional: Ingress configuration
  # ingress:
