# Example Grafana Dashboard for Pack 2 - DEV Team Overview
# This dashboard will be discovered by Pack 2's Grafana instance via label selectors

apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  labels:
    app.kubernetes.io/component: monitoring
    pack: two  # Critical: This label ensures Pack 2's Grafana discovers this dashboard
    dashboard: dev-team-overview
  name: dev-team-overview
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      pack: two

  # Dashboard JSON model
  json: |
    {
      "title": "DEV Team Overview - Pack 2",
      "tags": ["pack-two", "dev-team", "overview"],
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Pack 2 Metrics Collection Rate",
          "type": "graph",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(vmagent_remotewrite_samples_sent_total{pack=\"two\"}[5m])",
              "legendFormat": "Samples/sec",
              "refId": "A"
            }
          ],
          "yaxes": [
            {
              "format": "short",
              "label": "Samples/sec"
            },
            {
              "format": "short"
            }
          ]
        },
        {
          "id": 2,
          "title": "Application Request Rate",
          "type": "graph",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{pack=\"two\"}[5m])) by (service)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "yaxes": [
            {
              "format": "reqps",
              "label": "Requests/sec"
            },
            {
              "format": "short"
            }
          ]
        },
        {
          "id": 3,
          "title": "CPU Usage by Namespace",
          "type": "graph",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"dev-.*\"}[5m])) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "yaxes": [
            {
              "format": "percentunit",
              "label": "CPU Cores"
            },
            {
              "format": "short"
            }
          ]
        },
        {
          "id": 4,
          "title": "Memory Usage by Namespace",
          "type": "graph",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"dev-.*\"}) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "yaxes": [
            {
              "format": "bytes",
              "label": "Memory"
            },
            {
              "format": "short"
            }
          ]
        }
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ]
      }
    }
